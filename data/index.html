<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Monitor temperatura</title>
</head>
<body>
    <h1>Temperatura: <span id="valor">--</span></h1>

    <script>
        setInterval(function() {
            fetch("/temperatura")
            .then(response => response.text())
            .then(data => {
                document.getElementById("valor").innerText = data;
            });
        }, 500);
    </script>
</body>
</html>
